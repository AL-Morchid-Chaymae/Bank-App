<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Transactions – NovaBank</title>
    <link rel="icon" type="image/png" href="/img/logo1.png">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script>
        function toggleMode() {
            const body = document.body;
            const icon = document.getElementById("mode-icon");
            body.classList.toggle("dark-mode");

            if (body.classList.contains("dark-mode")) {
                icon.classList.replace("fa-moon", "fa-sun");
            } else {
                icon.classList.replace("fa-sun", "fa-moon");
            }
        }
    </script>
</head>

<body>

<nav class="navbar navbar-custom d-flex justify-content-between align-items-center">

    <a class="navbar-brand d-flex align-items-center" href="/dashboard">
        <img src="/img/logo2.png" class="nav-logo">
    </a>

    <div class="d-flex align-items-center">
        <ul class="navbar-nav d-flex flex-row mr-3">
            <li class="nav-item mx-3"><a class="nav-link" href="/dashboard">Dashboard</a></li>
            <li class="nav-item mx-3"><a class="nav-link" href="/transactions">Transactions</a></li>
            <li class="nav-item mx-3"><a class="nav-link" href="/logout">Logout</a></li>
        </ul>

        <i id="mode-icon" class="fa-solid fa-moon mode-toggle" onclick="toggleMode()"></i>
    </div>

</nav>

<div class="dashboard-wrapper">

    <div class="table-custom">
        <h3 class="text-center mb-4">Transaction History</h3>

        <table class="table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Date</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="t : ${transactions}">
                <td th:text="${t.id}"></td>
                <td th:text="${t.type}"></td>
                <td th:text="${t.amount}"
                    th:classappend="${t.type.contains('Deposit') || t.type.contains('In')} ? 'text-success' : 'text-danger'"></td>
                <td th:text="${t.timestamp}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <p class="text-center mt-3">
        <a href="/dashboard">Back to Dashboard</a>
    </p>

</div>
<br>
<br>
<br>
<footer>© 2025 NovaBank. All rights reserved.</footer>

</body>
</html>
