<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Account Overview - NovaBank</title>
    <link rel="icon" type="image/png" href="/img/logo1.png">


    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- Global CSS -->
    <link rel="stylesheet" href="/css/style.css">

    <!-- Icons (for moon / sun) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script>
        function toggleMode() {
            const body = document.body;
            const icon = document.getElementById("mode-icon");

            body.classList.toggle("dark-mode");

            if (body.classList.contains("dark-mode")) {
                icon.classList.remove("fa-moon");
                icon.classList.add("fa-sun");
            } else {
                icon.classList.remove("fa-sun");
                icon.classList.add("fa-moon");
            }
        }
    </script>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-custom d-flex justify-content-between align-items-center">

    <!-- Left section: Logo -->
    <a class="navbar-brand d-flex align-items-center" href="/dashboard">
        <img src="/img/logo2.png" class="nav-logo">

    </a>

    <!-- Right section: Links + Dark Mode Icon -->
    <div class="d-flex align-items-center">
        <ul class="navbar-nav d-flex flex-row mr-3">
            <li class="nav-item mx-3"><a class="nav-link" href="/dashboard">Dashboard</a></li>
            <li class="nav-item mx-3"><a class="nav-link" href="/transactions">Transactions</a></li>
            <li class="nav-item mx-3"><a class="nav-link" href="/logout">Logout</a></li>
        </ul>

        <!-- Dark Mode Icon -->
        <i id="mode-icon" class="fa-solid fa-moon mode-toggle" onclick="toggleMode()"></i>
    </div>

</nav>


<div class="dashboard-wrapper">

    <!-- USER CARD -->
    <div class="card mb-4">
        <h3 th:text="'Welcome, ' + ${account.username}"></h3>
        <h5 th:text="'Current Balance: $' + ${account.balance}"></h5>
    </div>

    <!-- ACCOUNT INFO -->
    <div class="card mb-4">
        <h4>Account Information</h4>
        <p><strong>Account Number:</strong> <span th:text="${account.id}"></span></p>
        <p><strong>Type:</strong> Personal Savings</p>
    </div>

    <!-- ACTIONS -->
    <div class="row">

        <!-- DEPOSIT -->
        <div class="col-md-4 mb-4">
            <button class="btn-main btn-block" data-toggle="collapse" data-target="#depositForm">
                Deposit
            </button>

            <div class="collapse" id="depositForm">
                <form action="/deposit" method="post" class="card p-3">
                    <label>Amount</label>
                    <input type="number" class="form-control" name="amount" required>
                    <button class="btn-main btn-block mt-3">Confirm</button>
                </form>
            </div>
        </div>

        <!-- WITHDRAW -->
        <div class="col-md-4 mb-4">
            <button class="btn-main btn-block" data-toggle="collapse" data-target="#withdrawForm">
                Withdraw
            </button>

            <div class="collapse" id="withdrawForm">
                <form action="/withdraw" method="post" class="card p-3">
                    <label>Amount</label>
                    <input type="number" class="form-control" name="amount" required>
                    <button class="btn-main btn-block mt-3">Confirm</button>
                </form>
            </div>
        </div>

        <!-- TRANSFER -->
        <div class="col-md-4 mb-4">
            <button class="btn-main btn-block" data-toggle="collapse" data-target="#transferForm">
                Transfer
            </button>

            <div class="collapse" id="transferForm">
                <form action="/transfer" method="post" class="card p-3">
                    <label>Recipient Username</label>
                    <input type="text" class="form-control" name="toUsername" required>

                    <label class="mt-2">Amount</label>
                    <input type="number" class="form-control" name="amount" required>

                    <button class="btn-main btn-block mt-3">Confirm</button>
                </form>
            </div>
        </div>

    </div>

    <!-- ERROR -->
    <p th:if="${error != null}" th:text="${error}"
       class="text-danger text-center font-weight-bold"></p>

</div>


<!-- FOOTER -->
<footer>
    © 2024 NovaBank — All rights reserved.
</footer>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
